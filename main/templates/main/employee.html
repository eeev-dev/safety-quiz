{% extends 'main/base.html' %}

{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static 'main/css/employee.css' %}">
{% endblock %}

{% block content %}

<div class="card">
    <h2> Данные сотрудника </h2>

    <form method="post" action="{% url 'main:index' %}" hx-post="{% url 'main:index' %}" hx-target="#main-content"
        hx-swap="innerHTML">
        {% csrf_token %}

        <div class="form-group">
            <label for="branch">Филиал</label>
            <select id="branch" name="branch_id" required hx-get="{% url 'main:index' %}" hx-target="#position"
                hx-include="#branch" hx-trigger="change" hx-swap="outerHTML">
                <option value disabled selected>Выберите филиал</option>
                {% for branch in branches %}
                <option value="{{ branch.id }}">{{ branch.title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group" id="position">
            <label for="position">Должность</label>
            <select name="position" required>
                <option value disabled selected>Сначала выберите филиал</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fullName">ФИО</label>
            <input type="text" id="fullName" name="fullName" placeholder="Введите ФИО" required>
        </div>

        <button type="submit" class="btn">Перейти к выбору билета</button>
    </form>
</div>

{% endblock %}
