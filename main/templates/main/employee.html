{% extends 'main/base.html' %}

{% load static %}

{% block style %}
<link id="style-link" hx-swap-oob="true" rel="stylesheet" href="{% static 'main/css/employee.css' %}">
{% endblock %}

{% block content %}

{% load i18n %}

<link id="style-link" hx-swap-oob="true" rel="stylesheet" href="{% static 'main/css/employee.css' %}">

<div class="card">
    <h2> {% trans "Employee data" %} </h2>

    <form method="post" action="{% url 'main:index' %}" hx-post="{% url 'main:index' %}" hx-target="#main-content"
        hx-swap="innerHTML">
        {% csrf_token %}

        <div class="form-group">
            <label for="branch">{% trans "Branch" %}</label>
            <select id="branch" name="branch_id" required hx-get="{% url 'main:index' %}" hx-target="#position"
                hx-include="#branch" hx-trigger="change" hx-swap="outerHTML">
                <option value disabled selected>{% trans "Select branch" %}</option>
                {% for branch in branches %}
                <option value="{{ branch.id }}">{{ branch.title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group" id="position">
            <label for="position">{% trans "Position" %}</label>
            <select name="position" required>
                <option value disabled selected>{% trans "First select branch" %}</option>
            </select>
        </div>

        <div class="form-group">
            <label for="number">{% trans "Tabel number" %}</label>
            <input type="text" id="number" name="number" placeholder="{% trans 'Enter tabel number' %}" required>
        </div>

        <div class="form-group">
            <label for="fullName">{% trans "Full name" %}</label>
            <input type="text" id="fullName" name="fullName" placeholder="{% trans 'Enter full name' %}" readonly required>
        </div>

        <button type="submit" class="btn" style="margin-bottom: 15px;">{% trans "Next" %}</button>
        <a href="{% url 'main:language' %}" hx-get="{% url 'main:language' %}" hx-target="#main-content"
            hx-swap="innerHTML" class="btn">{% trans "Change language" %}</a>
    </form>
</div>

<script>
    document.getElementById('number').addEventListener('input', function () {
        const number = this.value;
        if (number) {
            if (number.length == 4) {
                url = new URL("{% url 'main:index' %}", window.location.origin);
                url.searchParams.append("number", number);
                fetch(url.toString())
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('fullName').value = data.full_name || '';
                    });
            }
        }
    });
</script>

{% endblock %}
