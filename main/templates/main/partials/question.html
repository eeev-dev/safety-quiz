{% load i18n %}

<h2>{% trans "Ticket" %} №{{ card_number }}</h2>

<div class="question-section">
    <p>{{ question_number }}. {{ current_question.question }}</p>
    {% if current_question.image %}
    <img class="image" src="{{ current_question.image.url }}" alt="{% trans 'Picture' %}">
    {% endif %}
</div>

{% if is_last_question %}
<form hx-post="{% url 'main:card' %}" hx-target="#main-content" hx-swap="innerHTML">
{% else %}
<form hx-post="{% url 'main:card' %}" hx-target="#card" hx-swap="innerHTML">
{% endif %}
    {% csrf_token %}
    <div class="answers-section">
        {% for option in options %}
        <div class="form-group">
            <label>
                <input type="radio" name="answer" value="{{ option.id }}" />
                {{ option.option }}
            </label>
        </div>
        {% endfor %}
    </div>

    <button class="btn" type="submit">
        {% if is_last_question %}
        {% trans "Finish test" %}
        {% else %}
        {% trans "Next question" %}
        {% endif %}
    </button>
</form>
