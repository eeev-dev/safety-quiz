{% extends 'main/base.html' %}

{% load static %}

{% block content %}

{% load i18n %}

<link id="style-link" hx-swap-oob="true" rel="stylesheet" href="{% static 'main/css/employee.css' %}">

<div class="card">
    <h2> {% trans "Test" %} </h2>

    <form method="post" action="{% url 'main:test-entry' %}" hx-post="{% url 'main:test-entry' %}" hx-target="#main-content" hx-swap="innerHTML">
        {% csrf_token %}

        <div class="form-group">
            <label for="section">{% trans "Section" %}</label>
            <select id="section" name="section_id" required hx-get="{% url 'main:test-entry' %}" hx-target="#category"
                hx-include="#section" hx-trigger="change" hx-swap="outerHTML">
                <option value disabled selected>{% trans "Select section" %}</option>
                {% for section in sections %}
                <option value="{{ section.id }}">{{ section.title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group" id="category" style="margin-bottom: 15px;">
            <label for="category">{% trans "Category" %}</label>
            <select name="category" required>
                <option value disabled selected>{% trans "First select section" %}</option>
            </select>
        </div>

        <button type="submit" class="btn" style="margin-bottom: 15px;">{% trans "Proceed to test"%}</button>
    </form>
</div>

{% endblock %}
