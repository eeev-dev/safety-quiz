{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}

<style>
  form {
    max-width: 800px;
    margin: 20px auto;
    font-family: Arial, sans-serif;
  }

  h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
  }

  fieldset {
    border: 1px solid #999;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 30px;
    background: #f9f9f9;
  }

  legend {
    font-weight: bold;
    font-size: 1.2em;
    padding: 0 10px;
    color: #222;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 15px;
  }

  .row > div {
    flex: 1 1 45%;
    min-width: 280px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #444;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    padding: 8px 10px;
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 4px;
    resize: vertical;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    transition: border-color 0.3s ease;
  }

  textarea:focus {
    border-color: #007BFF;
    outline: none;
  }

  .option {
    margin-bottom: 12px;
    padding: 10px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
  }

  .option .row {
    align-items: center;
  }

  .option label {
    font-weight: normal;
  }

  .option input[type="checkbox"] {
    transform: scale(1.2);
    margin-left: 8px;
    cursor: pointer;
  }

  button[type="submit"] {
    display: block;
    margin: 30px auto;
    background-color: #007BFF;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 1.1em;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button[type="submit"]:hover {
    background-color: #0056b3;
  }
</style>
<h2>Редактирование вопросов</h2>
<form method="POST" action="{% url 'admin:upload_questions' %}">
  {% csrf_token %}
  <input type="hidden" name="category_id" value="{{ category_id }}">

  {% for q_idx, item in results %}
  <fieldset style="margin-bottom:30px; padding: 10px; border:1px solid #999;">
    <legend>Вопрос {{ q_idx }}</legend>
    <div class="row">
      <div>
        <label for="question_ru_{{ q_idx }}">Вопрос (RU)</label>
        <textarea id="question_ru_{{ q_idx }}" name="question_{{ q_idx }}_ru" required style="width: 100%;">{{ item.question.ru }}</textarea>
      </div>
      <div>
        <label for="question_kg_{{ q_idx }}">Суроо (KG)</label>
        <textarea id="question_kg_{{ q_idx }}" name="question_{{ q_idx }}_kg" required style="width: 100%;">{{ item.question.kg }}</textarea>
      </div>
    </div>

    <div id="options_{{ q_idx }}">
      {% for option in item.options %}
      <div class="option">
        <div class="row">
          <div>
            <label for="option_ru_{{ q_idx }}_{{ option.idx }}">Вариант ответа (RU)</label>
            <textarea id="option_ru_{{ q_idx }}_{{ option.idx }}" name="option_{{ q_idx }}_ru_{{ option.idx }}" required style="width: 100%;">{{ option.ru }}</textarea>
          </div>
          <div>
            <label for="option_kg_{{ q_idx }}_{{ option.idx }}">Жооп варианты (KG)</label>
            <textarea id="option_kg_{{ q_idx }}_{{ option.idx }}" name="option_{{ q_idx }}_kg_{{ option.idx }}" required style="width: 100%;">{{ option.kg }}</textarea>
          </div>
          <div style="display: flex; align-items: center; margin-left: 10px;">
            <label for="correct_{{ q_idx }}_{{ option.idx }}" style="font-weight: normal;">Правильный</label>
            <input type="checkbox" id="correct_{{ q_idx }}_{{ option.idx }}" name="correct_{{ q_idx }}_{{ option.idx }}" 
            {% if option.is_correct %}
              checked
            {% endif %}/>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </fieldset>
  {% endfor %}

  <button type="submit" style="margin-top: 20px; padding: 8px 16px;">Подтвердить</button>
</form>

<script>
document.querySelector("form").addEventListener("submit", function (e) {
    const questionBlocks = document.querySelectorAll("div[id^='options_']");
    let isValid = true;

    questionBlocks.forEach(block => {
        const checkboxes = block.querySelectorAll("input[type='checkbox']");
        const oneChecked = Array.from(checkboxes).some(cb => cb.checked);

        if (!oneChecked) {
            isValid = false;
            block.style.border = "2px solid red";
        } else {
            block.style.border = "";
        }
    });

    if (!isValid) {
        e.preventDefault();
        alert("Убедитесь, что в каждом вопросе выбран хотя бы один правильный вариант.");
    }
});
</script>
{% endblock %}
