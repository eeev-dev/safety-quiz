{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<script src="https://unpkg.com/htmx.org@1.9.2"></script>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group" style="margin-bottom: 15px;">
        <label for="section" style="margin-right: 15px;">{% trans "Section" %}</label>
        <select id="section" 
            name="section_id" 
            hx-get="{% url 'main:test-entry' %}" 
            hx-target="#category" 
            hx-include="#section" 
            hx-trigger="change" 
            hx-swap="outerHTML"
            required
        >
            <option value disabled selected>{% trans "Select section" %}</option>
            {% for section in sections %}
            <option value="{{ section.id }}">{{ section.title }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group" id="category" style="margin-bottom: 15px;">
        <label for="category" style="margin-right: 15px;">{% trans "Category" %}</label>
        <select name="category" required>
            <option value disabled selected>{% trans "First select section" %}</option>
        </select>
    </div>
    {{ form.as_p }}
    <input type="submit" value="Загрузить">
</form>
{% endblock %}
